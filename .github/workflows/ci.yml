name: CI

on:
  push:
    branches: [main]
  pull_request:

# Principle of least privilege: CI only needs to read the repo. No write,
# no package, no id-token, no secrets.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Safe public dummy values so the production build can complete in CI.
      # Real values are configured per-deployment, not in CI.
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-dummy-anon-key
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-dummy-anon-key
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: RLS policy static checks
        run: bun run check:rls

      - name: Public-claims scan
        run: bun run check:claims

      - name: Repository operations check
        run: bun run check:repo



      - name: Build
        run: bun run build
