name: Dependency Review

# Runs on pull requests against main. Flags newly-introduced dependencies
# with known vulnerabilities or incompatible licenses. Does not run on
# pushes — it is a PR gate only.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Fail only on high/critical vulnerabilities. Lower severities
          # are reported as warnings so dependency PRs are not blocked
          # by transient or low-impact advisories.
          fail-on-severity: high
          comment-summary-in-pr: on-failure
